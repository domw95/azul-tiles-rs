[package]
name = "wasm-engine"
version = "0.1.0"
edition = "2021"

# A spike, not a member of anything.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
azul-tiles-rs = { path = "..", default-features = false }
strum = { version = "0.26.3", features = ["derive"] }
# Pinned to the wasm work on minimaxer-rs (PR #2, branch wasm/spike).
# Becomes a plain master dependency once that merges.
minimaxer = { git = "ssh://git@github.com/domw95/minimaxer-rs.git", rev = "8a95028fd41a1611f9dfbaa533b399829fd761b9", default-features = false }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

